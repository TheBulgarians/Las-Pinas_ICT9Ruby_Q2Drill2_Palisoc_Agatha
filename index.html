rel="stylesheet">
            
    <style>
        body {
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            background-color: #ffffff;
            margin: 0;
            color: #333;
        }
        .container-fluid {
            padding: 20px;
        }
        img {
            max-width: 100%;
            height: auto;
            object-fit: contain;
        }
        h1 {
            color: #173b63;
            font-size: 30px;
            font-weight: bold;
            text-align: center;
            margin-top: 15px;
        }
        .container-fluid p {
            color: #666;
            font-size: 18px;
            text-align: center;
            font-style: italic;
        }
        .navbar-nav .nav-link {
            color: #173b63;
            font-weight: bold;
            padding: 10px 15px;
            font-size: 45px;     
            margin-right: 120px;
        }
        .navbar-nav .nav-link:hover {
            color: #666;
        }
        footer {
            background-color: #173b63;
            color: white;
            text-align: center;
            padding: 15px;
            margin-top: 30px;
        }
        footer p {
            margin: 0;
            font-size: 14px;
        }
        @media (max-width: 768px) {
            h1 {
                font-size: 22px;
            }

            .container-fluid p {
                font-size: 16px;
            }
        }
        @media (max-width: 576px) {
            h1 {
                font-size: 20px;
            }

            .container-fluid {
                padding: 12px;
            }

            .navbar-nav {
                text-align: center;
            }
        }
        .navbar {
            background-color: #e8edf3;
            padding: 10px;
        }
        .navbar-toggler {
            border: 2px solid #173b63;
        }
        .navbar-toggler:focus {
            box-shadow: none;
        }
    </style>
</head>

        aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
        </button>
